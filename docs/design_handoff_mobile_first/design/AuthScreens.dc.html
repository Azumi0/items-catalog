<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 16px 40px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--mantine-color-text);background:var(--mantine-color-body)">
<div style="width:100%;max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:24px">
<div style="display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center">
<span style="display:flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:18px;background:var(--mantine-color-teal-light);color:var(--mantine-color-teal-filled)"><x-import component-from-global-scope="HomeItemCatalog.IconBox" size="{{ 34 }}" hint-size="34px,34px"></x-import></span>
<div style="font-size:24px;font-weight:700;line-height:1.15">{{ title }}</div>
<div style="font-size:14px;color:var(--mantine-color-dimmed);text-wrap:pretty">{{ subtitle }}</div>
</div>

<div style="display:flex;flex-direction:column;gap:16px">
<div>
<div style="font-size:13px;font-weight:600;margin-bottom:6px">Login</div>
<input placeholder="Nazwa użytkownika" autocomplete="username" style="width:100%;height:52px;padding:0 14px;font-family:inherit;font-size:16px;color:inherit;background:var(--mantine-color-body);border:1px solid var(--mantine-color-default-border);border-radius:var(--mantine-radius-md);outline:none" />
</div>
<div>
<div style="font-size:13px;font-weight:600;margin-bottom:6px">Hasło</div>
<input type="password" placeholder="••••••" style="width:100%;height:52px;padding:0 14px;font-family:inherit;font-size:16px;color:inherit;background:var(--mantine-color-body);border:1px solid var(--mantine-color-default-border);border-radius:var(--mantine-radius-md);outline:none" />
</div>
<sc-if value="{{ isSetup }}" hint-placeholder-val="{{ false }}">
<div>
<div style="font-size:13px;font-weight:600;margin-bottom:6px">Powtórz hasło</div>
<input type="password" placeholder="••••••" style="width:100%;height:52px;padding:0 14px;font-family:inherit;font-size:16px;color:inherit;background:var(--mantine-color-body);border:1px solid var(--mantine-color-default-border);border-radius:var(--mantine-radius-md);outline:none" />
</div>
<div style="display:flex;gap:10px;padding:12px;border-radius:var(--mantine-radius-md);background:var(--mantine-color-teal-light);color:var(--mantine-color-teal-filled);font-size:13px;line-height:1.4">To pierwsze uruchomienie — zakładasz konto administratora katalogu. Kolejnych domowników dodasz w zakładce Użytkownicy.</div>
</sc-if>
<button onClick="{{ onSubmit }}" style="width:100%;min-height:52px;border:0;border-radius:var(--mantine-radius-md);font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;background:var(--mantine-color-teal-filled);color:var(--mantine-color-white)">{{ submitLabel }}</button>
<sc-if value="{{ isLogin }}" hint-placeholder-val="{{ true }}">
<button onClick="{{ onSwitch }}" style="width:100%;min-height:48px;border:0;border-radius:var(--mantine-radius-md);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;background:transparent;color:var(--mantine-color-teal-filled)">Pierwsze uruchomienie — załóż konto</button>
</sc-if>
<sc-if value="{{ isSetup }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ onSwitch }}" style="width:100%;min-height:48px;border:0;border-radius:var(--mantine-radius-md);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;background:transparent;color:var(--mantine-color-teal-filled)">Mam już konto — zaloguj się</button>
</sc-if>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:932},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;login&quot;,&quot;setup&quot;],&quot;default&quot;:&quot;login&quot;,&quot;tsType&quot;:&quot;'login' | 'setup'&quot;},&quot;onSubmit&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onSwitch&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const setup = this.props.mode === 'setup';
    return {
      isSetup: setup,
      isLogin: !setup,
      title: setup ? 'Konfiguracja katalogu' : 'Katalog Domowy',
      subtitle: setup ? 'Utwórz pierwsze konto, żeby zacząć spisywać rzeczy w domu.' : 'Zaloguj się, żeby przeglądać i dodawać przedmioty.',
      submitLabel: setup ? 'Utwórz konto i zacznij' : 'Zaloguj się',
      onSubmit: this.props.onSubmit,
      onSwitch: this.props.onSwitch,
    };
  }
}
</script>
</body>
</html>
